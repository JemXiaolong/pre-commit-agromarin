# Template pre-commit configuration for AgroMarin Odoo repositories
#
# Copy this file to your repo root as .pre-commit-config.yaml
# and adjust versions/hooks as needed.

exclude: |
  (?x)(
    ^setup/|/static/description/index\.html$|
    .svg$|/tests/([^/]+/)?cassettes/|
    ^README\.md$|
    /static/(src/)?lib/|
    ^docs/_templates/.*\.html$|
    (LICENSE.*|COPYING.*)|
    (\.travis\.yml|\.gitlab\-ci\.yml|\.pre\-commit\-config*\.yaml)|
    (/migrations/1[0-4])|
    (/doc/|/docs/)
  )
default_language_version:
  python: python3

repos:
  # === AgroMarin (ruff fork + custom Odoo fixers + JS/XML/PO + commit format) ===
  # agromarin-ruff-check / agromarin-ruff-format (v3.3.0+) install the
  # Agro-Marin/ruff fork (0.16.10+marin.2), which ships the Odoo linter
  # natively as the E85xx rules; upstream ruff does not know those codes,
  # which core/ruff.toml selects. The wheel is pinned by URL and sha256 in
  # this repo's .pre-commit-hooks.yaml, in lockstep with the fork's
  # odoo/requirements-dev.txt; bump both together. It is published for linux
  # x86_64 with glibc 2.39 or later only.
  # Config: ruff.toml in your repo root (extend core/ruff.toml if available).
  #
  # agromarin-commit-format (hosted since v3.1.0) requires installing the
  # commit-msg hook type: pre-commit install --hook-type commit-msg
  - repo: https://github.com/JemXiaolong/pre-commit-agromarin
    rev: v3.3.0
    hooks:
      - id: agromarin-ruff-check
        args: [--fix]
      - id: agromarin-ruff-format
      - id: agromarin-custom-fixers
      - id: agromarin-po-format
      - id: agromarin-prettier
      - id: agromarin-eslint
      - id: agromarin-commit-format

  # === Pylint-Odoo (heavy deps, kept separate) ===
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.3.23
    hooks:
      - id: pylint_odoo
        args:
          - --rcfile=.pylintrc

  # === File checks ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        exclude: /README\.rst$|^docs/.*\.rst$
      - id: debug-statements

  # === OCA (Odoo Community Association) ===
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.26
    hooks:
      - id: oca-checks-po
      - id: oca-checks-odoo-module
      - id: oca-checks-odoo-module-fixit

  # === Commit message ===
  # Enforced by the hosted agromarin-commit-format hook above (v3.1.0+).
  # No local script needed in the consumer repo.
