# Template pre-commit configuration for AgroMarin Odoo repositories
#
# Copy this file to your repo root as .pre-commit-config.yaml
# and adjust versions/hooks as needed.

exclude: |
  (?x)(
    ^setup/|/static/description/index\.html$|
    .svg$|/tests/([^/]+/)?cassettes/|
    ^README\.md$|
    /static/(src/)?lib/|
    ^docs/_templates/.*\.html$|
    (LICENSE.*|COPYING.*)|
    (\.travis\.yml|\.gitlab\-ci\.yml|\.pre\-commit\-config*\.yaml)|
    (/migrations/1[0-4])|
    (/doc/|/docs/)
  )
default_language_version:
  python: python3

repos:
  # === Ruff (linter + formatter, replaces black/isort/flake8/autoflake/pyupgrade/bugbear) ===
  # Config: ruff.toml in your repo root (extend core/ruff.toml if available)
  # Pin to an exact version and keep it in lockstep with the fork's core
  # (requirements-dev.txt, .github/workflows/ruff.yml, core/.pre-commit-config.yaml,
  # and the two consumer configs in enterprise/ and agromarin/).
  #
  # 0.16.2 is a hard floor, and not because of a rule selector: core/ruff.toml
  # declares `required-version = ">=0.16.2"` and uses the `output-prefer-rule-codes`
  # key, which 0.16.0 rejects outright — a TOML parse error blamed on line 1,
  # which reads like a corrupt config rather than an old binary.
  #
  # The older note here justified the floor with the preview selectors D420/D421
  # (0.15.19+). Those still resolve on 0.16.0, so they no longer set the floor.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # === AgroMarin (custom Odoo fixers + JS/XML/PO formatting + commit format) ===
  # Python linting was removed in v3.0.0; ruff handles it now.
  # agromarin-commit-format (hosted since v3.1.0) requires installing the
  # commit-msg hook type: pre-commit install --hook-type commit-msg
  - repo: https://github.com/JemXiaolong/pre-commit-agromarin
    rev: v3.2.0
    hooks:
      - id: agromarin-custom-fixers
      - id: agromarin-po-format
      - id: agromarin-prettier
      - id: agromarin-eslint
      - id: agromarin-commit-format

  # === Pylint-Odoo (heavy deps, kept separate) ===
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.3.23
    hooks:
      - id: pylint_odoo
        args:
          - --rcfile=.pylintrc

  # === File checks ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        exclude: /README\.rst$|^docs/.*\.rst$
      - id: debug-statements

  # === OCA (Odoo Community Association) ===
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.26
    hooks:
      - id: oca-checks-po
      - id: oca-checks-odoo-module
      - id: oca-checks-odoo-module-fixit

  # === Commit message ===
  # Enforced by the hosted agromarin-commit-format hook above (v3.1.0+).
  # No local script needed in the consumer repo.
