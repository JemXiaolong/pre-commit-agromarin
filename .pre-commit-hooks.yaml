- id: agromarin-ruff-check
  name: AgroMarin ruff check (Agro-Marin/ruff fork)
  description: >
    Run ruff check with the Agro-Marin/ruff fork, which ships the Odoo
    linter (E85xx rules, the per-file checks of test_lint) natively.
    Pinned to the same wheel as the fork's odoo/requirements-dev.txt.
  entry: ruff check --force-exclude
  language: python
  types_or: [python, pyi]
  require_serial: true
  additional_dependencies:
    - "ruff @ https://github.com/Agro-Marin/ruff/releases/download/0.16.10-marin.2/ruff-0.16.10%2Bmarin.2-py3-none-manylinux_2_39_x86_64.whl#sha256=c1fdcef09339e88e75644950c297e0acdde93e9ed2285a768fdc6f5375d35d29"

- id: agromarin-ruff-format
  name: AgroMarin ruff format (Agro-Marin/ruff fork)
  description: Run ruff format with the Agro-Marin/ruff fork.
  entry: ruff format --force-exclude
  language: python
  types_or: [python, pyi]
  require_serial: true
  additional_dependencies:
    - "ruff @ https://github.com/Agro-Marin/ruff/releases/download/0.16.10-marin.2/ruff-0.16.10%2Bmarin.2-py3-none-manylinux_2_39_x86_64.whl#sha256=c1fdcef09339e88e75644950c297e0acdde93e9ed2285a768fdc6f5375d35d29"

- id: agromarin-custom-fixers
  name: AgroMarin custom fixers (Odoo-specific)
  description: >
    Apply Odoo-specific auto-fixes that no generic linter covers:
    prefer-env-translation (_() -> self.env._()) and
    field-string-redundant (drop string= when it matches the auto-label).
    Generic Python lints are delegated to ruff.
  entry: agromarin-custom-fixers
  language: python
  types: [python]
  require_serial: true

- id: agromarin-po-format
  name: AgroMarin .po formatter
  description: Sort entries by msgid and clean redundant translations.
  entry: agromarin-po-format
  language: python
  types: [pofile]

- id: agromarin-prettier
  name: AgroMarin Prettier (XML/JS)
  description: Format XML and JavaScript files with Prettier.
  entry: prettier-xml
  language: node
  types_or: [javascript, xml]
  additional_dependencies:
    - 'prettier@3.8.1'
    - '@prettier/plugin-xml@3.4.1'

- id: agromarin-eslint
  name: AgroMarin ESLint (JS)
  description: Lint JavaScript files with ESLint and Odoo globals.
  entry: eslint --config .eslintrc.json
  language: node
  types: [javascript]
  additional_dependencies:
    - eslint@8.57.1

- id: agromarin-commit-format
  name: "AgroMarin commit format: [TAG] module: summary + Task ID"
  description: >
    Validate the commit message against the AgroMarin canonical format
    (coding_guidelines.rst §7.1): [TAG] module: summary (13 allowed tags,
    <= 80 chars) plus a "Task ID: XXXXX" footer. Merge commits and
    REL/MERGE tags bypass the body requirement.
  entry: agromarin-commit-format
  language: python
  stages: [commit-msg]
